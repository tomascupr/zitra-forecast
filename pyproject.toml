[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zitra-forecast"
version = "0.3.3"
description = "Zitra v3: 100% Apache-2.0 Probabilistic Time-Series Foundation Models (Zitra-Titan-v3 & Zitra-Core-v3) with Built-In Public Holiday Covariates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["time-series", "forecasting", "foundation-model", "probabilistic-forecasting", "pytorch", "apache-2.0"]
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "safetensors>=0.4.3",
    "huggingface-hub>=0.25.0",
    "tfc-t0[torch]>=0.6.1",
    "chronos-forecasting>=2.0.0",
    "granite-tsfm>=0.3.9",
    "einops>=0.7.0",
    "holidays>=0.58",
]

[project.optional-dependencies]
demo = [
    "gradio>=5.0.0",
    "plotly>=5.22.0",
]
all = [
    "gradio>=5.0.0",
    "plotly>=5.22.0",
]

[tool.setuptools.packages.find]
include = ["zitra*"]
